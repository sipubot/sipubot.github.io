<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>시퍼렁어</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      type="image/x-icon"
      href="https://sipubot.github.io/icon/favicon.ico"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://sipubot.github.io/icon/favicon.ico"
    />
    <link
      href="http://ajax.aspnetcdn.com/ajax/bootstrap/4.2.1/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="stylesheets/common.min.css">
    <!-- 1. 마크다운 변환 라이브러리 (marked) 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 2. 가독성을 위한 GitHub 마크다운 스타일 CSS 로드 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
    <style>
      /* 네비 20 우측 본문 80 퍼센트 줄바꿈 없앰*/
      .main-container {
        display: flex;
        align-items: flex-start; /* 자식 요소들이 위쪽 라인에 똑같이 맞춰지도록 설정 */
        width: 100%;
        height: 100%;
        min-height: 100vh; /* 화면 전체 높이 차지 */
      }
      nav {
        width: 40px;
        flex-shrink: 0; /* 화면이 작아져도 네비게이션 너비가 줄어들지 않도록 고정 */
      }
      /* 리스트 점(•) 제거 및 여백 초기화 */
      .sidebar ul {
        list-style: none !important;
      }
      .sidebar li {
        list-style: none !important;
      }
      .container {
        min-width: 0; /* 중요: 테이블이나 차트가 부모를 빠져나와 깨지는 현상 방지 */
        width: auto; /* 부트스트랩의 width: 100%를 무력화하여 남은 공간만 채우게 함 */
        flex: 1; /* 남은 공간을 모두 차지하도록 설정 */
        width: 80%;
      }
    </style>
  </head>

  <body>
    <div class="main-container">
      <nav class="sidebar">
        <ul id="ticker-nav">
        </ul>
      </nav>

      <div class="container p-0" id="stock-container">
       
      </div>
    </div>
    <script src="http://ajax.aspnetcdn.com/ajax/bootstrap/4.2.1/bootstrap.min.js"></script>
    <script src="./stock/stock.js"></script>
  </body>
</html>
